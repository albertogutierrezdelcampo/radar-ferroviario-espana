version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
  - package-ecosystem: "terraform"
    directory: "/infra/bootstrap"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    open-pull-requests-limit: 5
  - package-ecosystem: "terraform"
    directory: "/infra/production"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    open-pull-requests-limit: 5