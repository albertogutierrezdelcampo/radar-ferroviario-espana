name: Publish production image to ECR

"on":
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-ecr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    name: Build, verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4

      - name: Validate production tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "::error::This workflow can only publish Git tags"
            exit 1
          fi

          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid production tag: $GITHUB_REF_NAME"
            echo "Expected format: vN.N.N"
            exit 1
          fi

          echo "Publishing immutable production tag: $GITHUB_REF_NAME"

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: radar-ecr-${{ github.run_id }}

      - name: Confirm AWS identity
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: radar-ferroviario:release
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect production image metadata
        shell: bash
        run: |
          set -euo pipefail

          docker image inspect radar-ferroviario:release \
            --format='Image ID: {{.Id}}'

          docker image inspect radar-ferroviario:release \
            --format='OS/Architecture: {{.Os}}/{{.Architecture}}'

          docker image inspect radar-ferroviario:release \
            --format='Entrypoint: {{json .Config.Entrypoint}}'

          docker image inspect radar-ferroviario:release \
            --format='Command: {{json .Config.Cmd}}'

          docker image inspect radar-ferroviario:release \
            --format='User: {{.Config.User}}'

      - name: Verify application files
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --entrypoint /bin/sh \
            radar-ferroviario:release \
            -c '
              set -eu

              echo "=== Container filesystem under /app ==="
              find /app -maxdepth 4 \( -type f -o -type d \) \
                -print | sort

              verify_file() {
                required_path="$1"

                if [ ! -f "$required_path" ]; then
                  echo "::error::Missing required file: $required_path"
                  exit 1
                fi

                echo "OK file: $required_path"
              }

              verify_directory() {
                required_path="$1"

                if [ ! -d "$required_path" ]; then
                  echo "::error::Missing required directory: $required_path"
                  exit 1
                fi

                echo "OK directory: $required_path"
              }

              verify_file /app/app.py
              verify_file /app/wsgi.py
              verify_file /app/src/radar_app/application.py
              verify_directory /app/static
              verify_directory /app/templates

              echo "Production image contents verified"
            '

      - name: Verify non-root container user
        shell: bash
        run: |
          set -euo pipefail

          container_uid="$(
            docker run --rm \
              --entrypoint /usr/bin/id \
              radar-ferroviario:release \
              -u
          )"

          container_user="$(
            docker run --rm \
              --entrypoint /usr/bin/id \
              radar-ferroviario:release \
              -un
          )"

          echo "Container user: $container_user"
          echo "Container UID: $container_uid"

          if [[ "$container_uid" == "0" ]]; then
            echo "::error::Production container must not run as root"
            exit 1
          fi

      - name: Start release candidate
        shell: bash
        run: |
          set -euo pipefail

          docker run -d \
            --name radar-release \
            -p 8080:8080 \
            radar-ferroviario:release

          docker ps \
            --filter name=radar-release \
            --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'

      - name: Validate health endpoint
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 36); do
            echo "Health-check attempt ${attempt}/36"

            container_running="$(
              docker inspect radar-release \
                --format='{{.State.Running}}'
            )"

            if [[ "$container_running" != "true" ]]; then
              echo "::error::Container stopped before becoming healthy"
              docker ps -a
              docker logs radar-release
              exit 1
            fi

            if curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:8080/health/live \
              > /tmp/health.json; then

              echo "Health response:"
              cat /tmp/health.json
              echo
              echo "Release candidate is healthy"
              exit 0
            fi

            sleep 5
          done

          echo "::error::Health endpoint did not respond after 180 seconds"
          docker ps -a
          docker logs radar-release
          exit 1

      - name: Tag and publish immutable image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          remote_image="${ECR_REGISTRY}/${ECR_REPOSITORY}:${RELEASE_TAG}"

          echo "Publishing image: $remote_image"

          docker tag \
            radar-ferroviario:release \
            "$remote_image"

          docker push "$remote_image"

          {
            echo "## Published production image"
            echo
            echo "\`$remote_image\`"
            echo
            echo "- Source tag: \`$RELEASE_TAG\`"
            echo "- Architecture: \`linux/amd64\`"
            echo "- Registry: \`$ECR_REGISTRY\`"
            echo "- Repository: \`$ECR_REPOSITORY\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show container logs
        if: always()
        shell: bash
        run: |
          docker logs radar-release || true

      - name: Show container state
        if: always()
        shell: bash
        run: |
          docker ps -a \
            --filter name=radar-release \
            --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' \
            || true

      - name: Remove release candidate
        if: always()
        shell: bash
        run: |
          docker rm -f radar-release || true
