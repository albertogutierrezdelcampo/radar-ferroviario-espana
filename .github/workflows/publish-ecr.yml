name: Publish production image to ECR

"on":
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-ecr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == "tag" ]]
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "Publishing $GITHUB_REF_NAME"

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: radar-ecr-${{ github.run_id }}

      - name: Confirm AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: radar-ferroviario:release
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify application files
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint /bin/sh \
            radar-ferroviario:release \
            -c '
              set -eu
              test -f /app/app.py
              test -f /app/wsgi.py
              test -f /app/src/radar_app/application.py
              test -d /app/static
              test -d /app/templates
              echo "Production image contents verified"
            '

      - name: Start release candidate
        run: |
          docker run -d \
            --name radar-release \
            -p 8080:8080 \
            radar-ferroviario:release

      - name: Validate health endpoint
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 36); do
            echo "Health-check attempt ${attempt}/36"

            if ! docker inspect radar-release \
              --format='{{.State.Running}}' | grep -qx true; then
              echo "Container stopped before becoming healthy"
              docker ps -a
              docker logs radar-release
              exit 1
            fi

            if curl --fail --silent \
              http://127.0.0.1:8080/health/live \
              > /tmp/health.json; then
              cat /tmp/health.json
              echo
              echo "Release candidate is healthy"
              exit 0
            fi

            sleep 5
          done

          echo "Health endpoint timeout"
          docker ps -a
          docker logs radar-release
          exit 1

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="manual-${GITHUB_RUN_ID}"
          fi

          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Tag and publish immutable image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          remote_image="${ECR_REGISTRY}/${ECR_REPOSITORY}:${RELEASE_TAG}"

          docker tag radar-ferroviario:release "$remote_image"
          docker push "$remote_image"

          echo "Published image: $remote_image" >> "$GITHUB_STEP_SUMMARY"

      - name: Show container logs
        if: always()
        run: docker logs radar-release || true

      - name: Remove release candidate
        if: always()
        run: docker rm -f radar-release || true
