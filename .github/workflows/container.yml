name: Container

on:
  pull_request:
    branches:
      - dev
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "requirements.txt"
      - "app.py"
      - "wsgi.py"
      - "src/**"
      - "static/**"
      - "templates/**"
      - ".github/workflows/container.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build production container
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: radar-ferroviario:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify application files in image
        run: |
          docker run --rm \
            --entrypoint /bin/sh \
            radar-ferroviario:test \
            -c '
              set -eu
              test -f /app/app.py
              test -f /app/wsgi.py
              test -f /app/src/radar_app/application.py
              test -d /app/templates
              test -d /app/static
              echo "Container application files verified"
            '

      - name: Start container
        run: |
          docker run -d \
            --name radar-test \
            -p 8080:8080 \
            radar-ferroviario:test

      - name: Wait for health endpoint
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 36); do
            echo "Health-check attempt ${attempt}/36"

            if ! docker inspect radar-test \
              --format='{{.State.Running}}' | grep -qx true; then
              echo "Container stopped before becoming healthy"
              docker ps -a
              docker logs radar-test
              exit 1
            fi

            if curl --fail --silent \
              http://127.0.0.1:8080/health/live \
              > /tmp/health.json; then
              cat /tmp/health.json
              echo
              echo "Container health endpoint verified"
              exit 0
            fi

            sleep 5
          done

          echo "Health endpoint did not become ready after 180 seconds"
          docker ps -a
          docker logs radar-test
          exit 1

      - name: Show container logs
        if: always()
        run: docker logs radar-test || true

      - name: Remove test container
        if: always()
        run: docker rm -f radar-test || true