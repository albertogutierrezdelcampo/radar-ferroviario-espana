name: CI

on:
  pull_request:
    branches:
      - dev
      - qa
      - main

  push:
    branches:
      - dev
      - qa
      - main
      - "feature/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHONPATH: src
      RADAR_LOG_FILE: /tmp/radar-pytest.log

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install application and test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify dependencies
        run: |
          python --version
          python -m pytest --version
          python -m coverage --version
          python -m pip check

      - name: Compile Python
        run: |
          python -m py_compile \
            app.py \
            wsgi.py \
            src/radar_app/application.py \
            src/radar/*.py \
            src/radar/gtfs/*.py \
            tests/*.py

      - name: Unit tests
        run: |
          python -m pytest \
            -q \
            -m "not integration"

      - name: Integration tests
        run: |
          python -m pytest \
            -q \
            -m integration

      - name: Full suite with coverage
        run: |
          python -m pytest \
            -q \
            --cov \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=test-results.xml

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-python-3.12
          path: |
            coverage.xml
            test-results.xml
          retention-days: 3
          if-no-files-found: ignore
