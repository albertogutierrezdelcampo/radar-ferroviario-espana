name: CI
on:
  pull_request:
    branches: [dev, qa, main]
  push:
    branches: [feature/estabilizacion, dev, qa, main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile app.py
      - run: python -m pytest -q
      - name: Verify Jinja template parses
        run: python -c "from pathlib import Path; from jinja2 import Environment; Environment().parse(Path('templates/map.html').read_text())"
  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t radar-ferroviario:${{ github.sha }} .
      - run: docker run -d --name radar -p 8080:8080 radar-ferroviario:${{ github.sha }}
      - run: |
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8080/health/live && exit 0
            sleep 2
          done
          docker logs radar
          exit 1
