name: Release artifact
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source archive
        run: git archive --format=zip --output="Radar_Ferroviario_${GITHUB_REF_NAME}.zip" HEAD
      - uses: softprops/action-gh-release@v2
        with:
          files: Radar_Ferroviario_${{ github.ref_name }}.zip
          generate_release_notes: true
